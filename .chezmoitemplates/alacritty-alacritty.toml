{{ if eq .chezmoi.os "windows" -}}
[terminal]
shell = "nu"
{{- else -}}
# alacritty 0.13 (Ubuntu apt) predates the [terminal] table, and a desktop
# launch has no ~/.cargo/bin on PATH, so: top-level key, absolute path.
shell = "{{ .chezmoi.homeDir }}/.cargo/bin/nu"
{{- end }}

[font]
size = 11.0

[font.normal]
family = "FiraMono Nerd Font"
style  = "Regular"

[keyboard]
bindings = [
    { key = "F11", action = "ToggleFullscreen"},
    { key = "Return", mods = "Shift", chars = "\u001B\r"}
]

# Colors (Gruvbox dark)

# Default colors
[colors.primary]
# hard contrast background = = '#1d2021'
background = '#282828'
# soft contrast background = = '#32302f'
foreground = '#ebdbb2'

# Normal colors
[colors.normal]
black   = '#282828'
red     = '#cc241d'
green   = '#98971a'
yellow  = '#d79921'
blue    = '#458588'
magenta = '#b16286'
cyan    = '#689d6a'
white   = '#a89984'

# Bright colors
[colors.bright]
black   = '#928374'
red     = '#fb4934'
green   = '#b8bb26'
yellow  = '#fabd2f'
blue    = '#83a598'
magenta = '#d3869b'
cyan    = '#8ec07c'
white   = '#ebdbb2'
